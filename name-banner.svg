<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background Space Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#010206"/>
      <stop offset="50%" stop-color="#050b1e"/>
      <stop offset="100%" stop-color="#01030a"/>
    </linearGradient>

    <!-- Deep Space Nebulae & Fog Layer -->
    <radialGradient id="nebula1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0"/>
    </radialGradient>

    <!-- Right Side Heavy Fog -->
    <radialGradient id="rightRedFog" cx="85%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.28"/>
      <stop offset="45%" stop-color="#991b1b" stop-opacity="0.18"/>
      <stop offset="80%" stop-color="#3b0764" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="rightBlueFog" cx="95%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="visorGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="textClip">
      <rect x="140" y="35" width="550" height="60"/>
    </clipPath>

    <!-- Animation Keyframes -->
    <style>
      <![CDATA[
        @keyframes glitchRed { 
          0%,84%,100%{transform:translate(0,0);opacity:.6} 
          86%{transform:translate(-5px,0);opacity:.9} 
          89%{transform:translate(4px,0);opacity:.5} 
          92%{transform:translate(-3px,0);opacity:.85} 
          95%{transform:translate(3px,0);opacity:.55} 
        }
        @keyframes glitchCyan { 
          0%,82%,100%{transform:translate(0,0);opacity:.6} 
          85%{transform:translate(5px,0);opacity:.85} 
          88%{transform:translate(-4px,0);opacity:.5} 
          91%{transform:translate(3px,0);opacity:.9} 
          94%{transform:translate(-2px,0);opacity:.55} 
        }
        .g-red { animation: glitchRed 3.6s infinite; }
        .g-cyan { animation: glitchCyan 3.6s infinite; }
        
        @keyframes scanMove { 0%{transform:translateY(-40px)} 100%{transform:translateY(240px)} }
        .scanline { animation: scanMove 4.8s linear infinite; }
        
        @keyframes blink { 0%,45%{opacity:1} 50%,100%{opacity:0} }
        .cursor { animation: blink 1.1s step-end infinite; }
        
        @keyframes starPulseSlow {
          0%, 100% { opacity: 0.2; transform: scale(0.8); }
          50% { opacity: 1; transform: scale(1.4); }
        }
        @keyframes starPulseFast {
          0%, 100% { opacity: 0.3; transform: scale(0.9); }
          50% { opacity: 1; transform: scale(1.8); }
        }
        .star-p1 { animation: starPulseSlow 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
        .star-p2 { animation: starPulseFast 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }

        @keyframes shimmerMove { 0%{transform:translateX(0)} 100%{transform:translateX(700px)} }
        .shimmer { animation: shimmerMove 3.2s linear infinite; }

        @keyframes spinEndurance {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        .endurance-ring {
          animation: spinEndurance 22s linear infinite;
          transform-origin: 1040px 120px;
        }

        @keyframes orbitSpin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(-360deg); }
        }
        .orbit-line {
          animation: orbitSpin 35s linear infinite;
          transform-origin: 1040px 120px;
        }

        @keyframes spacewalkFloat {
          0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
          25% { transform: translate(-4px, 6px) rotate(-3deg); }
          50% { transform: translate(3px, -4px) rotate(2deg); }
          75% { transform: translate(-3px, -2px) rotate(-1deg); }
        }
        .astronaut-group {
          animation: spacewalkFloat 5.5s ease-in-out infinite;
          transform-origin: 800px 120px;
        }

        /* ROCKET FLYING LEFT TO RIGHT (NO FLAME) */
        @keyframes rocketLeftToRight {
          0% {
            transform: translate(-120px, 160px) rotate(-12deg);
            opacity: 0;
          }
          5% { opacity: 1; }
          95% { opacity: 1; }
          100% {
            transform: translate(1280px, 10px) rotate(-12deg);
            opacity: 0;
          }
        }
        .rocket-fly-group {
          animation: rocketLeftToRight 8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        /* TARS Robot Walking / Floating Animation */
        @keyframes tarsWalk {
          0%, 100% { transform: translate(0, 0) rotate(0deg); }
          25% { transform: translate(2px, -6px) rotate(3deg); }
          50% { transform: translate(0, -12px) rotate(-2deg); }
          75% { transform: translate(-2px, -6px) rotate(2deg); }
        }
        .tars-bot {
          animation: tarsWalk 4.5s ease-in-out infinite;
        }

        /* Subtitle Tech Items Float Animation */
        @keyframes subtitleTechFloat {
          0%, 100% { transform: translateY(0px); }
          50% { transform: translateY(-4px); }
        }
        .subtitle-tech-group {
          animation: subtitleTechFloat 4s ease-in-out infinite;
        }
      ]]>
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="240" fill="url(#bgGrad)"/>
  
  <!-- Nebulae -->
  <ellipse cx="250" cy="110" rx="350" ry="130" fill="url(#nebula1)"/>
  <ellipse cx="1020" cy="120" rx="320" ry="160" fill="url(#rightRedFog)"/>
  <ellipse cx="1100" cy="80" rx="200" ry="110" fill="url(#rightBlueFog)"/>

  <!-- Stars -->
  <g fill="#ffffff">
    <circle class="star-p1" cx="45" cy="20" r="1.8" opacity=".9"/>
    <circle class="star-p2" cx="180" cy="15" r="1.4" fill="#7dd3fc" opacity=".9" style="animation-delay:.2s"/>
    <circle class="star-p1" cx="310" cy="25" r="2.2" opacity=".95" style="animation-delay:.8s"/>
    <circle class="star-p2" cx="140" cy="210" r="1.5" opacity=".7" style="animation-delay:.5s"/>
    <circle class="star-p1" cx="480" cy="18" r="1.6" opacity=".8" style="animation-delay:1.1s"/>
    <circle class="star-p2" cx="620" cy="25" r="2.0" fill="#fef08a" opacity=".9" style="animation-delay:1.4s"/>
    <circle class="star-p1" cx="740" cy="205" r="1.3" opacity=".8" style="animation-delay:.3s"/>
    <circle class="star-p2" cx="890" cy="15" r="1.7" opacity=".9" style="animation-delay:1.7s"/>
    <circle class="star-p1" cx="950" cy="215" r="2.1" fill="#f43f5e" opacity=".85" style="animation-delay:.6s"/>
    <circle class="star-p2" cx="1140" cy="25" r="1.5" opacity=".8" style="animation-delay:2.1s"/>
    <circle class="star-p1" cx="1170" cy="190" r="1.9" fill="#38bdf8" opacity=".9" style="animation-delay:1.0s"/>
    
    <circle cx="90" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="230" cy="160" r="0.9" opacity="0.6"/>
    <circle cx="400" cy="170" r="0.7" opacity="0.4"/>
    <circle cx="680" cy="60" r="1.0" opacity="0.6"/>
    <circle cx="820" cy="150" r="0.7" opacity="0.5"/>
  </g>

  <!-- HUD Scanline -->
  <rect class="scanline" x="0" width="1200" height="40" fill="url(#scanGrad)"/>

  <!-- ==================== TARS ROBOT (INTERSTELLAR) ==================== -->
  <g class="tars-bot" transform="translate(710, 165)">
    <!-- 4 Articulated Vertical Monolith Segments -->
    <rect x="-18" y="-22" width="8" height="44" fill="#334155" stroke="#020617" stroke-width="1.2" rx="1"/>
    <rect x="-9" y="-22" width="8" height="44" fill="#475569" stroke="#020617" stroke-width="1.2" rx="1"/>
    <rect x="0" y="-22" width="8" height="44" fill="#334155" stroke="#020617" stroke-width="1.2" rx="1"/>
    <rect x="9" y="-22" width="8" height="44" fill="#475569" stroke="#020617" stroke-width="1.2" rx="1"/>
    
    <!-- TARS Metal Panels & Displays -->
    <rect x="-15" y="-14" width="4" height="2.5" fill="#38bdf8" filter="url(#glow)"/>
    <rect x="-6" y="-14" width="3" height="2" fill="#22c55e"/>
    <rect x="3" y="-14" width="3" height="2" fill="#ef4444"/>
    <line x1="-18" y1="0" x2="17" y2="0" stroke="#0f172a" stroke-width="1"/>
    
    <!-- TARS Label Text -->
    <text x="-12" y="14" font-family="'Courier New', monospace" font-size="5" font-weight="700" fill="#94a3b8" letter-spacing="1">TARS</text>
  </g>

  <!-- ==================== RIGHT SIDE: ORBIT, ENDURANCE & ASTRONAUT ==================== -->
  <g id="right-space-scene">
    <g class="orbit-line">
      <ellipse cx="1040" cy="120" rx="130" ry="95" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="8 6" opacity="0.4"/>
      <ellipse cx="1040" cy="120" rx="155" ry="110" fill="none" stroke="#ef4444" stroke-width="1" stroke-dasharray="4 8" opacity="0.3"/>
    </g>

    <!-- Endurance Space Station -->
    <g class="endurance-ring">
      <circle cx="1040" cy="120" r="65" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.4"/>
      <circle cx="1040" cy="120" r="54" fill="none" stroke="#64748b" stroke-width="2" opacity="0.6"/>
      <circle cx="1040" cy="120" r="16" fill="#0b0f19" stroke="#94a3b8" stroke-width="2"/>
      <circle cx="1040" cy="120" r="8" fill="#020617" stroke="#38bdf8" stroke-width="1" filter="url(#glow)"/>

      <g fill="#e2e8f0" stroke="#0f172a" stroke-width="1.2">
        <rect x="1033" y="58" width="14" height="15" rx="2"/>
        <rect x="1065" y="66" width="14" height="15" rx="2" transform="rotate(30 1040 120)"/>
        <rect x="1087" y="89" width="14" height="15" rx="2" transform="rotate(60 1040 120)"/>
        <rect x="1095" y="120" width="14" height="15" rx="2" transform="rotate(90 1040 120)"/>
        <rect x="1087" y="151" width="14" height="15" rx="2" transform="rotate(120 1040 120)"/>
        <rect x="1065" y="174" width="14" height="15" rx="2" transform="rotate(150 1040 120)"/>
        <rect x="1033" y="182" width="14" height="15" rx="2" transform="rotate(180 1040 120)"/>
        <rect x="1001" y="174" width="14" height="15" rx="2" transform="rotate(210 1040 120)"/>
        <rect x="979" y="151" width="14" height="15" rx="2" transform="rotate(240 1040 120)"/>
        <rect x="971" y="120" width="14" height="15" rx="2" transform="rotate(270 1040 120)"/>
        <rect x="979" y="89" width="14" height="15" rx="2" transform="rotate(300 1040 120)"/>
        <rect x="1001" y="66" width="14" height="15" rx="2" transform="rotate(330 1040 120)"/>
      </g>

      <line x1="1040" y1="60" x2="1040" y2="180" stroke="#64748b" stroke-width="2"/>
      <line x1="980" y1="120" x2="1100" y2="120" stroke="#64748b" stroke-width="2"/>
    </g>

    <!-- Astronaut -->
    <g class="astronaut-group" transform="translate(810, 65)">
      <path d="M -15 35 Q -45 60 -120 20" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.7"/>

      <rect x="-10" y="12" width="16" height="34" rx="4" fill="#475569" stroke="#0f172a" stroke-width="1.5"/>
      <rect x="-8" y="16" width="12" height="8" rx="1" fill="#0284c7"/>

      <rect x="2" y="14" width="28" height="32" rx="7" fill="#f8fafc" stroke="#0f172a" stroke-width="2"/>
      <rect x="10" y="20" width="12" height="10" rx="2" fill="#0f172a"/>
      <circle cx="13" cy="24" r="1.5" fill="#22c55e" filter="url(#glow)"/>
      <circle cx="18" cy="24" r="1.5" fill="#ef4444"/>

      <circle cx="16" cy="4" r="13" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
      <ellipse cx="18" cy="4" rx="8.5" ry="6.5" fill="url(#visorGold)" stroke="#92400e" stroke-width="1" filter="url(#glow)"/>

      <path d="M 4 18 L -12 28 L -6 35" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 4 18 L -12 28 L -6 35" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="-6" cy="35" r="3" fill="#0284c7"/>

      <path d="M 26 18 L 48 10 L 58 18" fill="none" stroke="#ffffff" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 26 18 L 48 10 L 58 18" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="58" cy="18" r="3.5" fill="#0284c7"/>

      <path d="M 10 44 L 4 64 L 10 68" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 10 44 L 4 64 L 10 68" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="6" y="64" width="8" height="5" rx="2" fill="#334155"/>

      <path d="M 22 44 L 26 65 L 34 67" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M 22 44 L 26 65 L 34 67" fill="none" stroke="#0f172a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="28" y="63" width="8" height="5" rx="2" fill="#334155"/>
    </g>

    <line x1="870" y1="82" x2="1040" y2="120" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6"/>
  </g>

  <!-- ==================== ROCKET FLYING (NO FLAME) ==================== -->
  <g class="rocket-fly-group">
    <g transform="rotate(90)">
      <g transform="translate(0, 50)">
        <rect x="-18" y="30" width="8" height="45" rx="3" fill="#cbd5e1" stroke="#020617" stroke-width="1.5"/>
        <path d="M -18 30 L -14 18 L -10 30 Z" fill="#ef4444"/>
        <rect x="10" y="30" width="8" height="45" rx="3" fill="#cbd5e1" stroke="#020617" stroke-width="1.5"/>
        <path d="M 10 30 L 14 18 L 18 30 Z" fill="#ef4444"/>

        <rect x="-11" y="10" width="22" height="72" rx="4" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
        <path d="M -11 10 Q 0 -22 11 10 Z" fill="#0284c7" stroke="#0f172a" stroke-width="1.5"/>
        <path d="M 0 -20 L 0 10" stroke="#38bdf8" stroke-width="1.5" opacity="0.7"/>

        <line x1="-11" y1="32" x2="11" y2="32" stroke="#0f172a" stroke-width="2"/>
        <rect x="-5" y="40" width="10" height="18" fill="#0f172a" rx="1"/>
        <circle cx="0" cy="20" r="3.5" fill="#38bdf8" stroke="#0f172a" stroke-width="1" filter="url(#glow)"/>
        
        <path d="M -11 65 L -22 82 L -11 78 Z" fill="#0369a1" stroke="#0f172a" stroke-width="1.5"/>
        <path d="M 11 65 L 22 82 L 11 78 Z" fill="#0369a1" stroke="#0f172a" stroke-width="1.5"/>
        <rect x="-7" y="82" width="14" height="6" fill="#1e293b" rx="1"/>
      </g>
    </g>
  </g>

  <!-- ==================== CENTER BRANDING & TYPOGRAPHY ==================== -->
  <g font-family="'Courier New', monospace" font-weight="700" text-anchor="start" letter-spacing="2">
    <text class="g-red" x="135" y="70" font-size="40" fill="#ff2e9a">&lt;SAKTHI MURUGESAN/&gt;</text>
    <text class="g-cyan" x="135" y="70" font-size="40" fill="#22d3ee">&lt;SAKTHI MURUGESAN/&gt;</text>
    <text x="135" y="70" font-size="40" filter="url(#glow)">
      <tspan fill="#38BDF8">&lt;</tspan><tspan fill="#ffffff">SAKTHI MURUGESAN</tspan><tspan fill="#38BDF8">/&gt;</tspan>
    </text>
  </g>
  
  <rect class="shimmer" x="50" y="35" width="80" height="60" fill="url(#shimmerGrad)" transform="skewX(-20)" clip-path="url(#textClip)"/>

  <!-- Subtitle Text -->
  <text x="137" y="105" font-family="'Courier New', monospace" font-size="13.5" letter-spacing="1.8" fill="#93c5fd" text-anchor="start">
    <tspan fill="#38BDF8">&gt;</tspan> FRONTEND ENGINEER · AI/RAG SYSTEMS BUILDER · MERN FULL-STACK
  </text>
  
  <rect class="cursor" x="720" y="92" width="8" height="14" fill="#38BDF8"/>
  <line x1="135" y1="122" x2="735" y2="122" stroke="#38BDF8" stroke-width="1" opacity="0.35"/>

  <!-- ==================== DIRECTLY BELOW SUBTITLE: SATELLITE & WATCH ==================== -->
  <g class="subtitle-tech-group" transform="translate(135, 160)">
    <!-- WRIST WATCH SPACESHIP -->
    <g transform="translate(60, 0) rotate(-15)">
      <rect x="-4" y="-28" width="8" height="18" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <rect x="-4" y="10" width="8" height="18" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="0" cy="0" r="14" fill="#0f172a" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="0" cy="0" r="11" fill="#020617" stroke="#38bdf8" stroke-width="1"/>
      <circle cx="0" cy="0" r="8" fill="#030712"/>
      <line x1="0" y1="0" x2="0" y2="-5" stroke="#f59e0b" stroke-width="1.2" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="3" y2="2" stroke="#38bdf8" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="1.2" fill="#ef4444"/>
      <rect x="13" y="-3" width="3" height="6" fill="#64748b" rx="1"/>
      <circle cx="15" cy="0" r="1.2" fill="#38bdf8" filter="url(#glow)"/>
    </g>

    <!-- SATELLITE -->
    <g transform="translate(220, 0) rotate(10)">
      <rect x="-8" y="-8" width="16" height="16" fill="#cbd5e1" stroke="#0f172a" stroke-width="1.2" rx="2"/>
      <circle cx="0" cy="0" r="3" fill="#0284c7"/>
      <rect x="-32" y="-5" width="22" height="10" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="-24" y1="-5" x2="-24" y2="5" stroke="#38bdf8" stroke-width="0.6"/>
      <line x1="-16" y1="-5" x2="-16" y2="5" stroke="#38bdf8" stroke-width="0.6"/>
      <rect x="10" y="-5" width="22" height="10" fill="#0369a1" stroke="#38bdf8" stroke-width="0.8"/>
      <line x1="18" y1="-5" x2="18" y2="5" stroke="#38bdf8" stroke-width="0.6"/>
      <line x1="26" y1="-5" x2="26" y2="5" stroke="#38bdf8" stroke-width="0.6"/>
      <line x1="0" y1="-8" x2="0" y2="-15" stroke="#94a3b8" stroke-width="1.2"/>
      <circle cx="0" cy="-15" r="1.8" fill="#ef4444" filter="url(#glow)"/>
    </g>

    <!-- Connecting Data Beam Line -->
    <line x1="-10" y1="-15" x2="320" y2="-15" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 3" opacity="0.4"/>
  </g>
</svg>
