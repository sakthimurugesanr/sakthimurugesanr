<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000003"/>
      <stop offset="55%" stop-color="#04050f"/>
      <stop offset="100%" stop-color="#000003"/>
    </linearGradient>

    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b3fbf" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#3b3fbf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="amberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff9a3d" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff9a3d" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="diskGradH" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#5c1200" stop-opacity="0.35"/>
      <stop offset="15%" stop-color="#ff6a00" stop-opacity="0.85"/>
      <stop offset="32%" stop-color="#fff2c8" stop-opacity="1"/>
      <stop offset="50%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="68%" stop-color="#fff2c8" stop-opacity="1"/>
      <stop offset="85%" stop-color="#ff6a00" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#5c1200" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="diskGradV" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5c1200" stop-opacity="0.3"/>
      <stop offset="15%" stop-color="#ff6a00" stop-opacity="0.8"/>
      <stop offset="35%" stop-color="#fff2c8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#fff8e0" stop-opacity="1"/>
      <stop offset="65%" stop-color="#fff2c8" stop-opacity="0.95"/>
      <stop offset="85%" stop-color="#ff6a00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#5c1200" stop-opacity="0.3"/>
    </linearGradient>

    <linearGradient id="engineGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0"/>
      <stop offset="100%" stop-color="#e0f7ff" stop-opacity="0.9"/>
    </linearGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.13"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowSoft" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>

    <clipPath id="textClip"><rect x="200" y="65" width="460" height="60"/></clipPath>

    <style>
      <![CDATA[
        @keyframes glitchRed { 0%,84%,100%{transform:translate(0,0);opacity:.6} 86%{transform:translate(-6px,0);opacity:.9} 89%{transform:translate(5px,0);opacity:.5} 92%{transform:translate(-4px,0);opacity:.85} 95%{transform:translate(4px,0);opacity:.55} }
        @keyframes glitchCyan { 0%,82%,100%{transform:translate(0,0);opacity:.6} 85%{transform:translate(6px,0);opacity:.85} 88%{transform:translate(-5px,0);opacity:.5} 91%{transform:translate(4px,0);opacity:.9} 94%{transform:translate(-3px,0);opacity:.55} }
        .g-red{animation:glitchRed 3.6s infinite}
        .g-cyan{animation:glitchCyan 3.6s infinite}
        @keyframes scanMove{0%{transform:translateY(-40px)}100%{transform:translateY(240px)}}
        .scanline{animation:scanMove 4.8s linear infinite}
        @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
        .cursor{animation:blink 1.1s step-end infinite}
        @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
        .star{animation:twinkle 2.6s ease-in-out infinite}
        @keyframes twinkleBig{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
        .sparkle{animation:twinkleBig 2.4s ease-in-out infinite;transform-origin:center}
        @keyframes shimmerMove{0%{transform:translateX(0)}100%{transform:translateX(640px)}}
        .shimmer{animation:shimmerMove 3.2s linear infinite}
        @keyframes diskPulse{0%,100%{opacity:.85}50%{opacity:1}}
        .disk{animation:diskPulse 3.4s ease-in-out infinite}
        @keyframes shipFly{
          0%{transform:translate(90px,50px) rotate(10deg);opacity:0}
          6%{opacity:1}
          45%{transform:translate(430px,95px) rotate(5deg);opacity:1}
          82%{transform:translate(700px,120px) rotate(2deg);opacity:1}
          94%{opacity:0}
          100%{transform:translate(90px,50px) rotate(10deg);opacity:0}
        }
        .ship{animation:shipFly 15s linear infinite}
        @keyframes thrust{0%,100%{opacity:.7}50%{opacity:1}}
        .engineTrail{animation:thrust .4s ease-in-out infinite}
      ]]>
    </style>
  </defs>

  <rect width="1200" height="240" fill="url(#bgGrad)"/>
  <ellipse cx="250" cy="60" rx="240" ry="110" fill="url(#nebula1)"/>
  <ellipse cx="260" cy="200" rx="260" ry="70" fill="url(#nebula3)"/>
  <ellipse cx="1000" cy="125" rx="300" ry="170" fill="url(#amberGlow)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle class="star" cx="45" cy="30" r="1.2" opacity=".7"/>
    <circle cx="95" cy="80" r="0.8" opacity=".5"/>
    <circle class="star" cx="180" cy="20" r="1" opacity=".6" style="animation-delay:.4s"/>
    <circle cx="260" cy="55" r="0.7" opacity=".4"/>
    <circle class="star" cx="320" cy="25" r="1.3" opacity=".8" style="animation-delay:1s"/>
    <circle cx="30" cy="170" r="0.9" opacity=".5"/>
    <circle class="star" cx="140" cy="200" r="1" opacity=".6" style="animation-delay:.7s"/>
    <circle cx="230" cy="170" r="0.8" opacity=".4"/>
    <circle class="star" cx="600" cy="18" r="1.1" opacity=".7" style="animation-delay:1.3s"/>
    <circle cx="680" cy="45" r="0.9" opacity=".5"/>
    <circle class="star" cx="740" cy="200" r="1" opacity=".55" style="animation-delay:.9s"/>
    <circle cx="500" cy="190" r="0.8" opacity=".4"/>
    <circle class="star" cx="120" cy="110" r="1" opacity=".6" style="animation-delay:1.6s"/>
    <circle cx="400" cy="70" r="0.7" opacity=".4"/>
    <circle class="star" cx="60" cy="60" r="0.9" opacity=".5" style="animation-delay:.3s"/>
    <circle cx="900" cy="30" r="0.7" opacity=".35"/>
    <circle class="star" cx="1150" cy="90" r="0.9" opacity=".5" style="animation-delay:1.9s"/>
    <circle cx="1080" cy="200" r="0.7" opacity=".35"/>
  </g>
  <g fill="#7dd3fc">
    <path class="sparkle" d="M60 130 L64 140 L74 144 L64 148 L60 158 L56 148 L46 144 L56 140 Z" style="animation-delay:.2s"/>
    <path class="sparkle" d="M700 25 L703 33 L711 36 L703 39 L700 47 L697 39 L689 36 L697 33 Z" style="animation-delay:1.4s"/>
  </g>

  <!-- black hole with accretion disk (Interstellar-style halo) -->
  <ellipse class="disk" cx="1000" cy="125" rx="145" ry="12" fill="url(#diskGradH)" filter="url(#glow)"/>
  <circle cx="925" cy="125" r="3" fill="#fff8e0" filter="url(#glow)">
    <animateMotion dur="7s" repeatCount="indefinite" path="M 0,0 A 145,12 0 1 1 150,0 A 145,12 0 1 1 0,0"/>
  </circle>
  <circle cx="1075" cy="125" r="2.4" fill="#ffdca8" filter="url(#glow)">
    <animateMotion dur="9.5s repeatCount=indefinite" begin="2s" path="M 0,0 A 145,12 0 1 1 -150,0 A 145,12 0 1 1 0,0"/>
  </circle>
  <ellipse class="disk" cx="1000" cy="125" rx="12" ry="85" fill="url(#diskGradV)" filter="url(#glow)"/>

  <circle cx="1000" cy="125" r="38" fill="#050208"/>
  <circle cx="1000" cy="125" r="40" fill="none" stroke="#fff2c8" stroke-width="1.6" opacity="0.9" filter="url(#glow)"/>

  <!-- moving scanline -->
  <rect class="scanline" x="0" width="1200" height="40" fill="url(#scanGrad)"/>

  <!-- traveling spacecraft -->
  <g class="ship">
    <polygon points="-16,0 8,-5 16,0 8,5" fill="#c7d2e0"/>
    <rect x="-5" y="-12" width="12" height="3" fill="#8ea0c2"/>
    <rect x="-5" y="9" width="12" height="3" fill="#8ea0c2"/>
    <circle cx="5" cy="0" r="2" fill="#7dd3fc" filter="url(#glow)"/>
    <polygon class="engineTrail" points="-16,0 -30,-3 -30,3" fill="url(#engineGrad)"/>
  </g>

  <!-- glitch title -->
  <g font-family="'Courier New', monospace" font-weight="700" text-anchor="middle" letter-spacing="2">
    <text class="g-red" x="430" y="108" font-size="44" fill="#ff2e9a">&lt;SAKTHI MURUGESAN/&gt;</text>
    <text class="g-cyan" x="430" y="108" font-size="44" fill="#22d3ee">&lt;SAKTHI MURUGESAN/&gt;</text>
    <text x="430" y="108" font-size="44" filter="url(#glow)">
      <tspan fill="#38BDF8">&lt;</tspan><tspan fill="#ffffff">SAKTHI MURUGESAN</tspan><tspan fill="#38BDF8">/&gt;</tspan>
    </text>
  </g>
  <rect class="shimmer" x="-100" y="65" width="80" height="60" fill="url(#shimmerGrad)" transform="skewX(-20)" clip-path="url(#textClip)"/>

  <!-- subtitle -->
  <text x="142" y="150" font-family="'Courier New', monospace" font-size="15" letter-spacing="2" fill="#93c5fd" text-anchor="start">
    <tspan fill="#38BDF8">&gt;</tspan> FRONTEND ENGINEER · AI/RAG SYSTEMS BUILDER · MERN FULL-STACK
  </text>
  <rect class="cursor" x="148" y="137" width="8" height="14" fill="#38BDF8"/>
  <line x1="120" y1="172" x2="760" y2="172" stroke="#38BDF8" stroke-width="1" opacity="0.3"/>
</svg>
