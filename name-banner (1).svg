<svg viewBox="0 0 1200 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#000005"/>
      <stop offset="50%" stop-color="#050718"/>
      <stop offset="100%" stop-color="#000005"/>
    </linearGradient>

    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#db2777" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula3" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowSpot" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="sunGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#fff7cc"/>
      <stop offset="55%" stop-color="#ffcc33"/>
      <stop offset="100%" stop-color="#ff8c1a"/>
    </radialGradient>

    <radialGradient id="sphereShade" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4"/>
    </radialGradient>

    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="shimmerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="cometGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.9"/>
    </linearGradient>

    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <clipPath id="textClip"><rect x="330" y="65" width="540" height="60"/></clipPath>
    <clipPath id="jupiterClip"><circle cx="565" cy="200" r="14"/></clipPath>

    <style>
      <![CDATA[
        @keyframes glitchRed { 0%,84%,100%{transform:translate(0,0);opacity:.6} 86%{transform:translate(-6px,0);opacity:.9} 89%{transform:translate(5px,0);opacity:.5} 92%{transform:translate(-4px,0);opacity:.85} 95%{transform:translate(4px,0);opacity:.55} }
        @keyframes glitchCyan { 0%,82%,100%{transform:translate(0,0);opacity:.6} 85%{transform:translate(6px,0);opacity:.85} 88%{transform:translate(-5px,0);opacity:.5} 91%{transform:translate(4px,0);opacity:.9} 94%{transform:translate(-3px,0);opacity:.55} }
        .g-red{animation:glitchRed 3.6s infinite}
        .g-cyan{animation:glitchCyan 3.6s infinite}
        @keyframes scanMove{0%{transform:translateY(-40px)}100%{transform:translateY(240px)}}
        .scanline{animation:scanMove 4.6s linear infinite}
        @keyframes blink{0%,45%{opacity:1}50%,100%{opacity:0}}
        .cursor{animation:blink 1.1s step-end infinite}
        @keyframes twinkle{0%,100%{opacity:.15}50%{opacity:1}}
        .star{animation:twinkle 2.6s ease-in-out infinite}
        @keyframes twinkleBig{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}
        .sparkle{animation:twinkleBig 2.4s ease-in-out infinite;transform-origin:center}
        @keyframes sunPulse{0%,100%{opacity:.55}50%{opacity:.9}}
        .corona{animation:sunPulse 3s ease-in-out infinite}
        @keyframes shimmerMove{0%{transform:translateX(0)}100%{transform:translateX(760px)}}
        .shimmer{animation:shimmerMove 3.2s linear infinite}
        @keyframes cometFly{0%,78%,100%{transform:translate(40px,20px);opacity:0}80%{opacity:1}87%{transform:translate(430px,110px);opacity:1}89%{opacity:0}}
        .comet{animation:cometFly 9s linear infinite}
      ]]>
    </style>
  </defs>

  <rect width="1200" height="240" fill="url(#bgGrad)"/>
  <ellipse cx="950" cy="55" rx="260" ry="120" fill="url(#nebula1)"/>
  <ellipse cx="140" cy="140" rx="220" ry="100" fill="url(#nebula2)"/>
  <ellipse cx="600" cy="200" rx="320" ry="70" fill="url(#nebula3)"/>
  <ellipse cx="600" cy="100" rx="420" ry="110" fill="url(#glowSpot)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle class="star" cx="45" cy="30" r="1.2" opacity=".7"/>
    <circle cx="95" cy="70" r="0.8" opacity=".5"/>
    <circle class="star" cx="180" cy="20" r="1" opacity=".6" style="animation-delay:.4s"/>
    <circle cx="260" cy="55" r="0.7" opacity=".4"/>
    <circle class="star" cx="320" cy="25" r="1.3" opacity=".8" style="animation-delay:1s"/>
    <circle cx="400" cy="45" r="0.9" opacity=".5"/>
    <circle class="star" cx="470" cy="20" r="1" opacity=".6" style="animation-delay:.7s"/>
    <circle cx="540" cy="50" r="0.8" opacity=".4"/>
    <circle class="star" cx="640" cy="18" r="1.1" opacity=".7" style="animation-delay:1.3s"/>
    <circle cx="720" cy="42" r="0.9" opacity=".5"/>
    <circle class="star" cx="790" cy="24" r="1.2" opacity=".7" style="animation-delay:.9s"/>
    <circle cx="860" cy="60" r="0.8" opacity=".45"/>
    <circle class="star" cx="930" cy="22" r="1" opacity=".65" style="animation-delay:1.6s"/>
    <circle cx="1010" cy="48" r="0.9" opacity=".5"/>
    <circle class="star" cx="1080" cy="20" r="1.2" opacity=".75" style="animation-delay:.5s"/>
    <circle cx="1150" cy="55" r="0.8" opacity=".45"/>
    <circle class="star" cx="60" cy="150" r="1" opacity=".6" style="animation-delay:1.1s"/>
    <circle cx="130" cy="185" r="0.8" opacity=".4"/>
    <circle class="star" cx="230" cy="160" r="1.1" opacity=".7" style="animation-delay:.3s"/>
    <circle cx="290" cy="130" r="0.7" opacity=".4"/>
    <circle class="star" cx="1000" cy="160" r="1" opacity=".6" style="animation-delay:1.4s"/>
    <circle cx="1070" cy="130" r="0.9" opacity=".5"/>
    <circle class="star" cx="1140" cy="170" r="1.1" opacity=".65" style="animation-delay:.8s"/>
    <circle cx="1120" cy="20" r="0.7" opacity=".4"/>
    <circle class="star" cx="20" cy="200" r="1" opacity=".55" style="animation-delay:1.9s"/>
    <circle cx="380" cy="15" r="0.7" opacity=".4"/>
    <circle class="star" cx="750" cy="15" r="0.9" opacity=".5" style="animation-delay:.2s"/>
  </g>
  <g fill="#7dd3fc">
    <path class="sparkle" d="M60 105 L64 115 L74 119 L64 123 L60 133 L56 123 L46 119 L56 115 Z" style="animation-delay:.2s"/>
    <path class="sparkle" d="M1140 60 L1143 68 L1151 71 L1143 74 L1140 82 L1137 74 L1129 71 L1137 68 Z" style="animation-delay:1s"/>
    <path class="sparkle" d="M980 30 L982 36 L988 38 L982 40 L980 46 L978 40 L972 38 L978 36 Z" style="animation-delay:1.7s"/>
  </g>

  <!-- comet -->
  <line class="comet" x1="0" y1="0" x2="42" y2="13" stroke="url(#cometGrad)" stroke-width="2" stroke-linecap="round"/>

  <!-- moving scanline -->
  <rect class="scanline" x="0" width="1200" height="40" fill="url(#scanGrad)"/>

  <!-- glitch title -->
  <g font-family="'Courier New', monospace" font-weight="700" text-anchor="middle" letter-spacing="2">
    <text class="g-red" x="600" y="108" font-size="44" fill="#ff2e9a">&lt;SAKTHI MURUGESAN/&gt;</text>
    <text class="g-cyan" x="600" y="108" font-size="44" fill="#22d3ee">&lt;SAKTHI MURUGESAN/&gt;</text>
    <text x="600" y="108" font-size="44" filter="url(#glow)">
      <tspan fill="#38BDF8">&lt;</tspan><tspan fill="#ffffff">SAKTHI MURUGESAN</tspan><tspan fill="#38BDF8">/&gt;</tspan>
    </text>
  </g>
  <rect class="shimmer" x="-100" y="65" width="90" height="60" fill="url(#shimmerGrad)" transform="skewX(-20)" clip-path="url(#textClip)"/>

  <!-- subtitle -->
  <text x="312" y="150" font-family="'Courier New', monospace" font-size="15" letter-spacing="2" fill="#93c5fd" text-anchor="start">
    <tspan fill="#38BDF8">&gt;</tspan> FRONTEND ENGINEER · AI/RAG SYSTEMS BUILDER · MERN FULL-STACK
  </text>
  <rect class="cursor" x="318" y="137" width="8" height="14" fill="#38BDF8"/>
  <line x1="300" y1="172" x2="900" y2="172" stroke="#38BDF8" stroke-width="1" opacity="0.35"/>

  <!-- solar system strip -->
  <line x1="95" y1="200" x2="945" y2="200" stroke="#3b5bdb" stroke-width="1" stroke-dasharray="3 5" opacity="0.35"/>

  <circle cx="70" cy="200" r="30" fill="#ff8c1a" opacity="0.25" filter="url(#softBlur)" class="corona"/>
  <circle cx="70" cy="200" r="20" fill="url(#sunGrad)" filter="url(#glow)"/>

  <circle cx="170" cy="200" r="4" fill="#9a9a9a"/>
  <circle cx="170" cy="200" r="4" fill="url(#sphereShade)"/>

  <circle cx="235" cy="200" r="6" fill="#e8c88f"/>
  <circle cx="235" cy="200" r="6" fill="url(#sphereShade)"/>

  <circle cx="305" cy="200" r="6.5" fill="#2f6fd6"/>
  <path d="M301 196 q4 -3 7 0 q-2 4 -7 2 Z" fill="#3fae5c" opacity="0.85"/>
  <circle cx="305" cy="200" r="6.5" fill="url(#sphereShade)"/>

  <circle cx="375" cy="200" r="5" fill="#c1440e"/>
  <circle cx="375" cy="200" r="5" fill="url(#sphereShade)"/>

  <circle cx="405" cy="198" r="1.2" fill="#8a8a8a"/>
  <circle cx="418" cy="202" r="1" fill="#8a8a8a"/>
  <circle cx="432" cy="197" r="1.3" fill="#8a8a8a"/>
  <circle cx="445" cy="201" r="1" fill="#8a8a8a"/>

  <circle cx="565" cy="200" r="14" fill="#d9a066"/>
  <g clip-path="url(#jupiterClip)" opacity="0.5">
    <rect x="551" y="192" width="28" height="3" fill="#b97b4b"/>
    <rect x="551" y="199" width="28" height="3" fill="#b97b4b"/>
    <rect x="551" y="206" width="28" height="3" fill="#b97b4b"/>
  </g>
  <circle cx="565" cy="200" r="14" fill="url(#sphereShade)"/>

  <ellipse cx="705" cy="200" rx="20" ry="6" fill="none" stroke="#c9b27a" stroke-width="2" opacity="0.8" transform="rotate(-15 705 200)"/>
  <circle cx="705" cy="200" r="12" fill="#e8d19a"/>
  <circle cx="705" cy="200" r="12" fill="url(#sphereShade)"/>
  <ellipse cx="705" cy="200" rx="20" ry="6" fill="none" stroke="#e8d19a" stroke-width="1.5" opacity="0.5" transform="rotate(-15 705 200)"/>

  <circle cx="825" cy="200" r="8" fill="#a3e8e0"/>
  <circle cx="825" cy="200" r="8" fill="url(#sphereShade)"/>

  <circle cx="920" cy="200" r="8" fill="#3b5bdb"/>
  <circle cx="920" cy="200" r="8" fill="url(#sphereShade)"/>
</svg>
